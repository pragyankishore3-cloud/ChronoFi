name: ChronoFi Backend CI

on:
  push:
    branches: [ "master", "main", "feature/**" ]
  pull_request:
    branches: [ "master", "main", "feature/**" ]

jobs:
  test:
    name: Backend Test Suite (108 Tests)
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY: "dummy_ci_key"
      JWT_SECRET_KEY: "test_secret_key_ci"
    steps:
    - uses: actions/checkout@v4

    - name: Install uv and Python 3.14
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true
        version: "latest"
        python-version: "3.14"

    - name: Install dependencies
      run: |
        uv sync --dev

    - name: Run pytest test suite
      run: |
        uv run pytest tests/ -v
