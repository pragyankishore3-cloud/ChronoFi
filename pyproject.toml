[project]
name = "chronofi-backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Piyush", email = "pa1792980@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "aiosqlite>=0.22.1",
    "alembic>=1.20.0",
    "asyncpg>=0.31.0",
    "fastapi>=0.142.2",
    "google-genai>=2.28.0",
    "greenlet>=3.5.6",
    "langchain>=1.4.3",
    "langchain-google-genai>=4.4.0",
    "numpy-financial>=1.1.0",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.4",
    "sqlalchemy>=2.1.3",
    "uvicorn>=0.54.0",
]

[project.scripts]
chronofi-backend = "chronofi_backend:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
