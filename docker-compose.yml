version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: chronofi_postgres
    environment:
      POSTGRES_USER: chronofi_user
      POSTGRES_PASSWORD: chronofi_password
      POSTGRES_DB: chronofi_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
